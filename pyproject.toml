[project]
name = "seace-mcp"
version = "0.2.1"
description = "MCP local para buscar en el Sistema Electrónico de Contrataciones del Estado (Seace). No oficial."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.28,<2",
    "httpx>=0.27",
]

[project.scripts]
seace-mcp = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
package = true
